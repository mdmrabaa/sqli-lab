{% extends "base.html" %}
{% block content %}
<h1>Login</h1>
<p class="subtitle">Authenticate to access the lab</p>

<div class="card" style="max-width:440px;">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" autocomplete="off" autofocus placeholder="Enter username or injection payload">
    <label>Password</label>
    <input type="password" name="password" autocomplete="off" placeholder="Enter password">
    <button type="submit" style="width:100%; margin-top:4px;">Sign In</button>
  </form>
</div>

<p class="hint">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
{% endblock %}

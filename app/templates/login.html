<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login — SQLi Lab</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; background:#0f1115; color:#e6e6e6; }
    input { padding:8px; width:100%; margin-bottom:10px; background:#1b1e24; border:1px solid #333; color:#e6e6e6; border-radius:4px; }
    button { padding:8px 16px; background:#2d6cdf; border:none; color:white; border-radius:4px; cursor:pointer; }
    .result { margin-top:20px; padding:12px; border-radius:6px; background:#1b1e24; }
    pre { white-space:pre-wrap; word-break:break-all; background:#262a33; padding:10px; border-radius:6px; }
    a { color:#6fb3ff; }
  </style>
</head>
<body>
  <p><a href="/">&larr; back</a></p>
  <h1>Login</h1>
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" autocomplete="off">
    <label>Password</label>
    <input type="text" name="password" autocomplete="off">
    <button type="submit">Log in</button>
  </form>

  {% if result %}
  <div class="result">
    <strong>Result:</strong> {{ result }}
    {% if query_shown %}
      <p><strong>Query executed (lab-only visibility):</strong></p>
      <pre>{{ query_shown }}</pre>
    {% endif %}
  </div>
  {% endif %}

  <p style="margin-top:30px; opacity:0.7; font-size:13px;">
    Hints to try: <code>admin' --</code> as username, or <code>' OR '1'='1</code>.
  </p>
</body>
</html>

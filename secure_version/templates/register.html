{% extends "base.html" %}
{% block content %}
<h1>Register</h1>
<p class="subtitle">Create your account to access the lab</p>

<div class="card" style="max-width:440px;">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" autocomplete="off" autofocus placeholder="Choose a username">
    <label>Password</label>
    <input type="password" name="password" autocomplete="off" placeholder="Choose a password">
    <button type="submit" style="width:100%; margin-top:4px;">Create Account</button>
  </form>
</div>

<p class="hint">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
{% endblock %}
